<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV — Dawit Mezemir Anelay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      font-family: "Inter", "Trebuchet MS", Helvetica, sans-serif;
      color: #222;
      background: #f3f4f6;
      line-height: 1.5;
    }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { list-style: none; }

    /* ── Top bar ── */
    .top-bar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .top-bar a { font-size: 0.82rem; color: #6b7280; }
    .top-bar a:hover { color: #2563eb; text-decoration: none; }
    .btn-download {
      font-size: 0.82rem;
      font-family: inherit;
      font-weight: 500;
      color: #fff;
      background: #2563eb;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-download:hover { background: #1d4ed8; }

    /* ── CV wrapper ── */
    .cv-wrap {
      max-width: 820px;
      margin: 28px auto 48px;
      background: #fff;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      padding: 40px 48px;
    }

    /* ── Header ── */
    .cv-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1.5px solid #111;
    }
    .cv-name { font-size: 1.7rem; font-weight: 700; color: #111; letter-spacing: -0.3px; margin-bottom: 4px; }
    .cv-title { font-size: 0.88rem; font-weight: 500; color: #444; margin-bottom: 2px; }
    .cv-location { font-size: 0.8rem; color: #666; margin-bottom: 12px; }
    .cv-contacts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 22px;
      font-size: 0.78rem;
    }
    .cv-contacts a { color: #2563eb; }

    /* ── Body rows: left label + right content ── */
    .cv-row {
      display: grid;
      grid-template-columns: 156px 1fr;
      gap: 0 24px;
      padding: 13px 0;
      border-top: 1px solid #e5e7eb;
    }
    .cv-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #111;
      line-height: 1.5;
      padding-top: 1px;
    }

    /* ── Summary ── */
    .summary-para { font-size: 0.82rem; color: #374151; line-height: 1.6; }

    /* ── Skills ── */
    .skill-list { padding-left: 14px; }
    .skill-list li { list-style: disc; font-size: 0.8rem; color: #374151; margin-bottom: 4px; line-height: 1.45; }
    .skill-list li:last-child { margin-bottom: 0; }
    .skill-cat { font-weight: 600; }

    /* ── Experience / Projects ── */
    .entry { margin-bottom: 14px; }
    .entry:last-child { margin-bottom: 0; }
    .entry-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .entry-role { font-size: 0.85rem; font-weight: 700; color: #111; }
    .entry-period { font-size: 0.77rem; color: #6b7280; white-space: nowrap; flex-shrink: 0; }
    .entry-company { font-size: 0.78rem; color: #555; margin-bottom: 5px; }
    .entry-bullets { padding-left: 14px; margin-top: 5px; }
    .entry-bullets li { list-style: disc; font-size: 0.78rem; color: #374151; margin-bottom: 3px; line-height: 1.5; }

    /* ── Research ── */
    .research-title { font-size: 0.84rem; font-weight: 700; color: #111; line-height: 1.4; margin-bottom: 3px; }
    .research-meta { font-size: 0.77rem; color: #555; margin-bottom: 2px; }
    .research-supervisors { font-size: 0.77rem; color: #555; font-style: italic; margin-bottom: 6px; }

    /* ── Education ── */
    .edu-entry { margin-bottom: 10px; }
    .edu-entry:last-child { margin-bottom: 0; }
    .edu-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .edu-degree { font-size: 0.83rem; font-weight: 700; color: #111; }
    .edu-period { font-size: 0.77rem; color: #6b7280; white-space: nowrap; flex-shrink: 0; }
    .edu-institution { font-size: 0.78rem; color: #555; }

    /* ── Certifications ── */
    .cert-list { padding-left: 14px; }
    .cert-list li { list-style: disc; font-size: 0.78rem; color: #374151; margin-bottom: 4px; line-height: 1.4; }
    .cert-list li:last-child { margin-bottom: 0; }

    /* ── Print ── */
    @media print {
      .top-bar { display: none !important; }
      html { font-size: 9.5px; }
      body { background: #fff; line-height: 1.3; }
      .cv-wrap { margin: 0; padding: 8mm 10mm; box-shadow: none; max-width: 100%; }
      @page { size: A4; margin: 0; }
      .cv-header { margin-bottom: 10px; padding-bottom: 10px; }
      .cv-name { font-size: 1.5rem; margin-bottom: 2px; }
      .cv-location { margin-bottom: 8px; }
      .cv-row { padding: 7px 0; }
      .summary-para { line-height: 1.4; }
      .skill-list li { margin-bottom: 2px; line-height: 1.3; }
      .entry { margin-bottom: 8px; page-break-inside: avoid; }
      .entry-company { margin-bottom: 3px; }
      .entry-bullets { margin-top: 3px; }
      .entry-bullets li { margin-bottom: 1px; line-height: 1.3; }
      .research-supervisors { margin-bottom: 3px; }
      .edu-entry { margin-bottom: 6px; }
      .cert-list li { margin-bottom: 2px; line-height: 1.25; }
    }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      .cv-wrap { margin: 0; padding: 24px 18px; box-shadow: none; }
      .cv-row { grid-template-columns: 1fr; }
      .cv-label { color: #2563eb; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; margin-bottom: 10px; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="/">← Back to site</a>
  <button class="btn-download" onclick="window.print()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download PDF
  </button>
</div>

<div class="cv-wrap" id="cv"></div>

<script src="/content.js"></script>
<script>
'use strict';

function h(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function lnk(href, text, external) {
  var a = document.createElement('a');
  a.href = href;
  a.textContent = text;
  if (external) { a.target = '_blank'; a.rel = 'noreferrer'; }
  return a;
}
function addRow(body, labelText, buildFn) {
  var row = h('div', 'cv-row');
  row.appendChild(h('div', 'cv-label', labelText));
  var content = h('div', 'cv-content');
  buildFn(content);
  row.appendChild(content);
  body.appendChild(row);
}

var cv = document.getElementById('cv');
document.title = 'CV — ' + SITE.profile.name;

// ── Header ──────────────────────────────────────────────────────────────────
var hdr = h('div', 'cv-header');
hdr.appendChild(h('div', 'cv-name', SITE.profile.name));
hdr.appendChild(h('div', 'cv-title', SITE.profile.title));
hdr.appendChild(h('div', 'cv-location', SITE.contact.location));

var contacts = h('div', 'cv-contacts');
var c = SITE.contact;
[
  ['mailto:' + c.email,                 c.email,          false],
  [c.linkedin.url,                       c.linkedin.label, true],
  [c.github.url,                         c.github.label,   true],
  ['tel:' + c.phone.replace(/\s/g,''),  c.phone,          false],
].forEach(function(item) {
  var span = document.createElement('span');
  span.appendChild(lnk(item[0], item[1], item[2]));
  contacts.appendChild(span);
});
hdr.appendChild(contacts);
cv.appendChild(hdr);

// ── Body ─────────────────────────────────────────────────────────────────────
var body = h('div', 'cv-body');

// — Summary —
addRow(body, 'Summary', function(el) {
  el.appendChild(h('p', 'summary-para', SITE.about[0]));
});

// — Skills —
addRow(body, 'Skills', function(el) {
  var ul = h('ul', 'skill-list');
  Object.entries(SITE.skills).forEach(function(pair) {
    var li = h('li', '');
    li.appendChild(h('span', 'skill-cat', pair[0] + ': '));
    li.appendChild(document.createTextNode(pair[1].join(', ')));
    ul.appendChild(li);
  });
  el.appendChild(ul);
});

// — Work Experience — (first role capped at 9 bullets to keep CV to 2 pages)
addRow(body, 'Work Experience', function(el) {
  SITE.experience.forEach(function(job, idx) {
    var entry = h('div', 'entry');
    var top = h('div', 'entry-top');
    top.appendChild(h('div', 'entry-role', job.role));
    top.appendChild(h('div', 'entry-period', job.period));
    entry.appendChild(top);
    var company = [job.company, job.location].filter(Boolean).join(', ');
    if (company) entry.appendChild(h('div', 'entry-company', company));
    if (job.bullets && job.bullets.length) {
      var bullets = idx === 0 ? job.bullets.slice(0, 9) : job.bullets;
      var ul = h('ul', 'entry-bullets');
      bullets.forEach(function(b) { ul.appendChild(h('li', '', b)); });
      entry.appendChild(ul);
    }
    el.appendChild(entry);
  });
});

// — Projects —
addRow(body, 'Projects', function(el) {
  SITE.projects.forEach(function(proj) {
    var entry = h('div', 'entry');
    entry.appendChild(h('div', 'entry-role', proj.title));
    if (proj.bullets && proj.bullets.length) {
      var ul = h('ul', 'entry-bullets');
      proj.bullets.forEach(function(b) { ul.appendChild(h('li', '', b)); });
      entry.appendChild(ul);
    }
    el.appendChild(entry);
  });
});

// — Research & Thesis —
addRow(body, 'Research & Thesis', function(el) {
  var r = SITE.research;
  var titleEl = h('div', 'research-title');
  titleEl.appendChild(lnk(r.url, r.title, true));
  el.appendChild(titleEl);
  el.appendChild(h('div', 'research-meta', r.degree));
  el.appendChild(h('div', 'research-supervisors', 'Supervisors: ' + r.supervisors));
  if (r.bullets && r.bullets.length) {
    var ul = h('ul', 'entry-bullets');
    r.bullets.forEach(function(b) { ul.appendChild(h('li', '', b)); });
    el.appendChild(ul);
  }
});

// — Education —
addRow(body, 'Education', function(el) {
  SITE.education.forEach(function(edu) {
    var entry = h('div', 'edu-entry');
    var top = h('div', 'edu-top');
    top.appendChild(h('span', 'edu-degree', edu.degree));
    top.appendChild(h('span', 'edu-period', edu.period));
    entry.appendChild(top);
    entry.appendChild(h('div', 'edu-institution', edu.institution));
    el.appendChild(entry);
  });
});

// — Certifications —
addRow(body, 'Certifications', function(el) {
  var ul = h('ul', 'cert-list');
  SITE.certifications.forEach(function(cert) {
    ul.appendChild(h('li', '', cert));
  });
  el.appendChild(ul);
});

cv.appendChild(body);
</script>

</body>
</html>
