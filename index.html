<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dawit Mezemir Anelay</title>
  <meta name="description" content="DevOps Engineer, Cloud Engineer, MSc Computer Science (AI). Portfolio, blog, and reading notes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; scroll-behavior: smooth; }
    body {
      font-family: "Inter", "Trebuchet MS", Helvetica, sans-serif;
      color: #333;
      background: #fff;
      line-height: 1.6;
    }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { list-style: none; }
    img { max-width: 100%; display: block; }

    /* ── Nav ── */
    .site-nav {
      border-bottom: 1px solid #e5e7eb;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-inner {
      max-width: 1060px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 2px;
      height: 50px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-inner::-webkit-scrollbar { display: none; }
    .nav-home {
      font-weight: 600;
      font-size: 0.9rem;
      color: #111;
      margin-right: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-home:hover { text-decoration: none; color: #2563eb; }
    .nav-inner a {
      font-size: 0.82rem;
      color: #555;
      padding: 5px 10px;
      border-radius: 5px;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-inner a:hover { background: #f3f4f6; color: #111; text-decoration: none; }
    .nav-inner a.nav-active { background: #eff6ff; color: #2563eb; font-weight: 500; }

    /* ── Layout ── */
    .page {
      max-width: 1060px;
      margin: 0 auto;
      padding: 36px 24px 64px;
      display: flex;
      gap: 48px;
      align-items: flex-start;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 210px;
      flex-shrink: 0;
      position: sticky;
      top: 66px;
    }
    .sidebar-photo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 14px;
    }
    .sidebar-name {
      font-size: 0.97rem;
      font-weight: 600;
      color: #111;
      margin-bottom: 5px;
      line-height: 1.3;
    }
    .sidebar-title {
      font-size: 0.78rem;
      color: #6b7280;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .sidebar-contacts {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-contacts li {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .contact-icon {
      display: flex;
      align-items: center;
      width: 20px;
      flex-shrink: 0;
      color: #9ca3af;
      margin-top: 1px;
    }
    .contact-value {
      font-size: 0.78rem;
      color: #374151;
      overflow-wrap: anywhere;
    }
    .contact-value a { color: #374151; }
    .contact-value a:hover { color: #2563eb; text-decoration: none; }
    .available-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      font-size: 0.74rem;
      color: #15803d;
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .available-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .cv-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
      font-size: 0.74rem;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      padding: 4px 10px;
      border-radius: 999px;
      text-decoration: none;
    }
    .cv-link:hover { color: #2563eb; border-color: #bfdbfe; background: #eff6ff; text-decoration: none; }

    /* ── Main ── */
    .main { flex: 1; min-width: 0; }

    /* ── Section ── */
    .section { margin-bottom: 52px; }
    .section-heading {
      font-size: 1.1rem;
      font-weight: 600;
      color: #111;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 8px;
      margin-bottom: 22px;
    }
    .subsection-heading {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin: 28px 0 14px;
    }

    /* ── About ── */
    .about-text p { font-size: 0.9rem; line-height: 1.75; margin-bottom: 10px; }
    .about-text p:last-child { margin-bottom: 0; }

    /* ── Timeline ── */
    .timeline-entry { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f3f4f6; }
    .timeline-entry:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .timeline-role { font-size: 0.9rem; font-weight: 600; color: #111; margin-bottom: 2px; }
    .timeline-meta { font-size: 0.8rem; color: #6b7280; margin-bottom: 8px; }
    .timeline-bullets { padding-left: 16px; }
    .timeline-bullets li {
      list-style: disc;
      font-size: 0.85rem;
      color: #444;
      margin-bottom: 4px;
      line-height: 1.55;
    }

    /* ── Skills ── */
    .skills-grid { display: grid; gap: 14px; }
    .skill-row-label { font-size: 0.8rem; font-weight: 500; color: #555; margin-bottom: 7px; }
    .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .edu-courses { margin-top: 6px; padding-left: 16px; display: none; }
    .edu-courses li { list-style: disc; font-size: 0.84rem; color: #6b7280; margin-bottom: 3px; }
    .courses-toggle {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #6b7280;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .courses-toggle:hover { color: #2563eb; }
    .chip {
      font-size: 0.76rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: #f9fafb;
      color: #374151;
      border: 1px solid #e5e7eb;
    }

    /* ── Certifications ── */
    .cert-list { padding-left: 16px; }
    .cert-list li {
      list-style: disc;
      font-size: 0.85rem;
      color: #444;
      margin-bottom: 5px;
      line-height: 1.55;
    }

    /* ── Research ── */
    .research-title { font-size: 0.92rem; font-weight: 600; color: #111; margin-bottom: 4px; line-height: 1.4; }
    .research-meta { font-size: 0.8rem; color: #6b7280; margin-bottom: 12px; line-height: 1.5; }
    .research-bullets { padding-left: 16px; margin-top: 10px; margin-bottom: 2px; }
    .research-bullets li { list-style: disc; font-size: 0.86rem; color: #444; line-height: 1.65; margin-bottom: 5px; }
    .research-links { display: flex; gap: 18px; margin-top: 12px; flex-wrap: wrap; }
    .research-links a { font-size: 0.84rem; }

    /* ── Projects ── */
    .project-entry { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f3f4f6; }
    .project-entry:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .entry-tag {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    .entry-title { font-size: 0.9rem; font-weight: 600; color: #111; margin-bottom: 6px; }
    .entry-bullets { padding-left: 16px; }
    .entry-bullets li { list-style: disc; font-size: 0.85rem; color: #4b5563; line-height: 1.65; margin-bottom: 4px; }

    /* ── Blog ── */
    .blog-entry { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f3f4f6; }
    .blog-entry:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .blog-date { font-size: 0.75rem; color: #9ca3af; margin-bottom: 4px; }
    .blog-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 5px; }
    .blog-excerpt { font-size: 0.85rem; color: #4b5563; line-height: 1.65; margin-bottom: 8px; }
    .blog-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .blog-tag {
      font-size: 0.72rem;
      padding: 2px 8px;
      background: #eff6ff;
      color: #2563eb;
      border-radius: 999px;
      border: 1px solid #bfdbfe;
    }
    .empty-note { font-size: 0.85rem; color: #9ca3af; }
    .series-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f3f4f6; }
    .series-card:last-child { border-bottom: none; }
    .series-card-name { font-size: 0.9rem; font-weight: 600; color: #111; }
    .series-card-count { font-size: 0.78rem; color: #9ca3af; flex-shrink: 0; }
    .blog-footer { margin-top: 20px; font-size: 0.85rem; }

    /* ── Books ── */
    .books-table { width: 100%; border-collapse: collapse; }
    .books-table th {
      text-align: left;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      border-bottom: 1px solid #e5e7eb;
      padding: 0 12px 8px 0;
    }
    .books-table td {
      padding: 11px 12px 11px 0;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: top;
    }
    .books-table tbody tr:last-child td { border-bottom: none; }
    .book-title { font-size: 0.86rem; font-weight: 500; color: #111; }
    .book-author { font-size: 0.78rem; color: #9ca3af; margin-top: 2px; }
    .book-notes { font-size: 0.8rem; color: #6b7280; }
    .status-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .status-read     { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .status-reading  { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .status-want     { background: #f9fafb; color: #6b7280; border: 1px solid #e5e7eb; }

    /* ── Contact ── */
    .contact-body { font-size: 0.9rem; }
    .contact-body p { margin-bottom: 8px; line-height: 1.7; }
    .contact-body p:first-child { color: #4b5563; margin-bottom: 18px; }

    /* ── Mobile ── */
    @media (max-width: 720px) {
      .page { flex-direction: column; gap: 28px; padding: 20px 16px 48px; }
      .sidebar { width: 100%; position: static; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
      .sidebar-photo { margin-bottom: 0; }
      .sidebar-info { flex: 1; min-width: 160px; }
      .sidebar-contacts { margin-top: 14px; width: 100%; }
      .books-table td:nth-child(3),
      .books-table th:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner" id="site-nav"></div>
</nav>

<div class="page">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<script src="/content.js"></script>
<script src="/layout.js"></script>
<script>
'use strict';

// ── tiny DOM helper ───────────────────────────────────────────────────────
function h(tag, className, text) {
  var e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}
function a(href, text, cls, external) {
  var e = document.createElement('a');
  e.href = href;
  if (cls) e.className = cls;
  e.textContent = text;
  if (external) { e.target = '_blank'; e.rel = 'noreferrer'; }
  return e;
}
function section(id, label) {
  var sec = document.createElement('section');
  sec.id = id;
  sec.className = 'section';
  sec.appendChild(h('h2', 'section-heading', label));
  return sec;
}

// ── Nav + Sidebar (shared via layout.js) ─────────────────────────────────
buildNav('');
buildSidebar();

// ── Main ─────────────────────────────────────────────────────────────────
var main = document.getElementById('main');

// — About —
(function() {
  var sec = section('about', 'About');
  var wrap = h('div', 'about-text');
  SITE.about.forEach(function(p) { wrap.appendChild(h('p', '', p)); });
  sec.appendChild(wrap);
  main.appendChild(sec);
})();

// — Resume —
(function() {
  var sec = section('resume', 'Resume');

  // Experience
  sec.appendChild(h('h3', 'subsection-heading', 'Work Experience'));
  SITE.experience.forEach(function(job) {
    var entry = h('div', 'timeline-entry');
    entry.appendChild(h('div', 'timeline-role', job.role));
    var meta = [job.company, job.location, job.period].filter(Boolean).join(' · ');
    entry.appendChild(h('div', 'timeline-meta', meta));
    if (job.bullets.length) {
      var ul = h('ul', 'timeline-bullets');
      job.bullets.forEach(function(b) { ul.appendChild(h('li', '', b)); });
      entry.appendChild(ul);
    }
    sec.appendChild(entry);
  });

  // Education
  sec.appendChild(h('h3', 'subsection-heading', 'Education'));
  SITE.education.forEach(function(edu) {
    var entry = h('div', 'timeline-entry');
    entry.appendChild(h('div', 'timeline-role', edu.degree));
    entry.appendChild(h('div', 'timeline-meta', edu.institution + ' · ' + edu.period));
    if (edu.courses && edu.courses.length) {
      var ul = h('ul', 'edu-courses');
      edu.courses.forEach(function(c) { ul.appendChild(h('li', '', c)); });

      var btn = document.createElement('button');
      btn.className = 'courses-toggle';
      btn.innerHTML = 'Coursework (' + edu.courses.length + ') <span>▾</span>';
      btn.addEventListener('click', function() {
        var open = ul.style.display === 'block';
        ul.style.display = open ? 'none' : 'block';
        btn.innerHTML = 'Coursework (' + edu.courses.length + ') <span>' + (open ? '▾' : '▴') + '</span>';
      });

      entry.appendChild(btn);
      entry.appendChild(ul);
    }
    sec.appendChild(entry);
  });

  // Skills
  sec.appendChild(h('h3', 'subsection-heading', 'Skills'));
  var grid = h('div', 'skills-grid');
  Object.entries(SITE.skills).forEach(function(entry) {
    var group = entry[0], items = entry[1];
    var row = document.createElement('div');
    row.appendChild(h('div', 'skill-row-label', group));
    var chips = h('div', 'chip-list');
    items.forEach(function(s) { chips.appendChild(h('span', 'chip', s)); });
    row.appendChild(chips);
    grid.appendChild(row);
  });
  sec.appendChild(grid);

  // Certifications
  sec.appendChild(h('h3', 'subsection-heading', 'Certifications'));
  var certList = h('ul', 'cert-list');
  SITE.certifications.forEach(function(c) { certList.appendChild(h('li', '', c)); });
  sec.appendChild(certList);

  main.appendChild(sec);
})();

// — Research —
(function() {
  var sec = section('research', 'Research');
  var r = SITE.research;

  var card = h('div', 'research-card');
  var titleEl = h('div', 'research-title');
  titleEl.appendChild(a(r.url, r.title, '', true));
  card.appendChild(titleEl);
  card.appendChild(h('div', 'research-meta', r.degree));
  card.appendChild(h('div', 'research-meta', 'Supervisors: ' + r.supervisors));

  if (r.bullets && r.bullets.length) {
    var ul = h('ul', 'research-bullets');
    r.bullets.forEach(function(b) { ul.appendChild(h('li', '', b)); });
    card.appendChild(ul);
  }

  var links = h('div', 'research-links');
  r.links.forEach(function(l) { links.appendChild(a(l.url, l.label, '', true)); });
  card.appendChild(links);

  sec.appendChild(card);
  main.appendChild(sec);
})();

// — Projects —
(function() {
  var sec = section('projects', 'Projects');
  SITE.projects.forEach(function(p) {
    var entry = h('div', 'project-entry');
    entry.appendChild(h('div', 'entry-tag', p.tag));
    entry.appendChild(h('div', 'entry-title', p.title));
    if (p.bullets && p.bullets.length) {
      var ul = h('ul', 'entry-bullets');
      p.bullets.forEach(function(b) { ul.appendChild(h('li', '', b)); });
      entry.appendChild(ul);
    }
    sec.appendChild(entry);
  });
  main.appendChild(sec);
})();

// — Blog —
(function() {
  var sec = section('blog', 'Blog');
  if (!SITE.blog.length) {
    sec.appendChild(h('p', 'empty-note', 'No posts yet.'));
    main.appendChild(sec);
    return;
  }

  // Auto-detect series: any tag on 3+ posts
  var tagCount = {};
  SITE.blog.forEach(function(post) {
    (post.tags || []).forEach(function(t) { tagCount[t] = (tagCount[t] || 0) + 1; });
  });
  var seriesTags = Object.keys(tagCount).filter(function(t) { return tagCount[t] >= 3; });

  // Series rows
  seriesTags.forEach(function(name) {
    var card = h('div', 'series-card');
    var nameEl = h('div', '');
    var link = a('/blog/', name, 'series-card-name');
    nameEl.appendChild(link);
    card.appendChild(nameEl);
    card.appendChild(h('span', 'series-card-count', tagCount[name] + ' posts'));
    sec.appendChild(card);
  });

  // Standalone posts (title + date only)
  var standalone = SITE.blog.filter(function(post) {
    return !(post.tags || []).some(function(t) { return seriesTags.indexOf(t) !== -1; });
  });
  if (standalone.length) {
    if (seriesTags.length) sec.appendChild(h('h3', 'subsection-heading', 'Recent'));
    standalone.forEach(function(post) {
      var entry = h('div', 'blog-entry');
      entry.appendChild(h('div', 'blog-date', post.date));
      var titleEl = h('div', 'blog-title');
      titleEl.appendChild(a(post.url, post.title));
      entry.appendChild(titleEl);
      if (post.excerpt) entry.appendChild(h('div', 'blog-excerpt', post.excerpt));
      sec.appendChild(entry);
    });
  }

  var footer = h('div', 'blog-footer');
  footer.appendChild(a('/blog/', 'Browse all posts →'));
  sec.appendChild(footer);

  main.appendChild(sec);
})();

// — Books —
(function() {
  var sec = section('books', 'Books');
  var statusMap = {
    'read':         ['Read',         'status-read'],
    'reading':      ['Reading',      'status-reading'],
    'want to read': ['Want to read', 'status-want'],
  };

  var table = document.createElement('table');
  table.className = 'books-table';

  var thead = document.createElement('thead');
  var hrow = document.createElement('tr');
  ['Title / Author', 'Status', 'Notes'].forEach(function(col) {
    hrow.appendChild(h('th', '', col));
  });
  thead.appendChild(hrow);
  table.appendChild(thead);

  var tbody = document.createElement('tbody');
  SITE.books.forEach(function(book) {
    var row = document.createElement('tr');

    var titleTd = document.createElement('td');
    titleTd.appendChild(h('div', 'book-title', book.title));
    titleTd.appendChild(h('div', 'book-author', book.author));
    row.appendChild(titleTd);

    var pair = statusMap[book.status] || ['—', 'status-want'];
    var statusTd = document.createElement('td');
    statusTd.appendChild(h('span', 'status-badge ' + pair[1], pair[0]));
    row.appendChild(statusTd);

    row.appendChild(h('td', 'book-notes', book.notes || ''));
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  sec.appendChild(table);
  main.appendChild(sec);
})();

// — Contact —
(function() {
  var sec = section('contact', 'Contact');
  var body = h('div', 'contact-body');

  var intro = h('p', '', 'Open to DevOps, platform engineering, and cloud infrastructure roles. Focused on secure delivery, production reliability, and operational excellence.');
  body.appendChild(intro);

  [
    ['mailto:' + SITE.contact.email,                        SITE.contact.email,                  false],
    ['tel:' + SITE.contact.phone.replace(/\s/g,''),         SITE.contact.phone,                  false],
    [SITE.contact.linkedin.url,                             SITE.contact.linkedin.label,          true],
    [SITE.contact.github.url,                               SITE.contact.github.label,            true],
  ].forEach(function(item) {
    var p = document.createElement('p');
    p.appendChild(a(item[0], item[1], '', item[2]));
    body.appendChild(p);
  });

  sec.appendChild(body);
  main.appendChild(sec);

  document.title = SITE.profile.name;
})();

// — Scroll spy —
(function() {
  var navLinks = Array.from(document.querySelectorAll('.nav-inner a[href^="#"]'));

  function setActive(id) {
    navLinks.forEach(function(link) {
      var matches = link.getAttribute('href') === '#' + id;
      link.classList.toggle('nav-active', matches);
    });
  }

  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) setActive(entry.target.id);
    });
  }, { rootMargin: '-20% 0px -70% 0px', threshold: 0 });

  document.querySelectorAll('section[id]').forEach(function(s) { observer.observe(s); });
})();
</script>

</body>
</html>
